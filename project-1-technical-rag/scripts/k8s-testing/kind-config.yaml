kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: epic8-testing
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # API Gateway
  - containerPort: 8080
    hostPort: 8080
    protocol: TCP
  # Query Analyzer
  - containerPort: 8082
    hostPort: 8082
    protocol: TCP
  # Generator
  - containerPort: 8081
    hostPort: 8081
    protocol: TCP
  # Retriever
  - containerPort: 8083
    hostPort: 8083
    protocol: TCP
  # Cache
  - containerPort: 8084
    hostPort: 8084
    protocol: TCP
  # Analytics
  - containerPort: 8085
    hostPort: 8085
    protocol: TCP
  # Ingress Controller
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker
  labels:
    node-role: epic8-worker
- role: worker
  labels:
    node-role: epic8-worker
