name: Test Coverage Analysis

on:
  push:
    branches: [ main, epic8 ]
  pull_request:
    branches: [ main, epic8 ]
  schedule:
    # Run coverage analysis nightly at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov coverage[toml]
        
        # Install project dependencies
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

    - name: Create coverage directories
      run: |
        mkdir -p reports/coverage

    - name: Run unit test coverage
      run: |
        python -m pytest tests/unit/ \
          --cov=src \
          --cov-report=json:reports/coverage/unit_coverage.json \
          --cov-report=xml:reports/coverage/unit_coverage.xml \
          --cov-report=html:reports/coverage/unit_html \
          --cov-fail-under=60 \
          --tb=short \
          --maxfail=10
      continue-on-error: true

    - name: Run integration test coverage
      run: |
        python -m pytest tests/integration/ tests/component/ \
          --cov=src \
          --cov-append \
          --cov-report=json:reports/coverage/integration_coverage.json \
          --cov-report=xml:reports/coverage/integration_coverage.xml \
          --cov-report=html:reports/coverage/integration_html \
          --cov-fail-under=50 \
          --tb=short \
          --maxfail=5
      continue-on-error: true

    - name: Run comprehensive coverage analysis
      run: |
        python -m pytest \
          tests/unit/ \
          tests/integration/ \
          tests/component/ \
          --cov=src \
          --cov-report=json:reports/coverage/comprehensive_coverage.json \
          --cov-report=xml:reports/coverage/comprehensive_coverage.xml \
          --cov-report=html:reports/coverage/comprehensive_html \
          --cov-report=term-missing \
          --tb=short \
          --maxfail=20
      continue-on-error: true

    - name: Generate coverage dashboard
      run: |
        if [ -f reports/coverage/comprehensive_coverage.json ]; then
          python scripts/generate_coverage_dashboard.py \
            reports/coverage/comprehensive_coverage.json \
            -o reports/coverage/dashboard.html
        fi
      continue-on-error: true

    - name: Coverage summary
      run: |
        if [ -f reports/coverage/comprehensive_coverage.json ]; then
          python -c "
import json
import sys

try:
    with open('reports/coverage/comprehensive_coverage.json') as f:
        data = json.load(f)
    
    total = data.get('totals', {})
    percent = total.get('percent_covered', 0)
    lines = total.get('num_statements', 0)
    covered = total.get('covered_lines', 0)
    missing = total.get('missing_lines', 0)
    
    print('')
    print('📊 COVERAGE ANALYSIS SUMMARY')
    print('=' * 40)
    print(f'Overall Coverage: {percent:.1f}%')
    print(f'Total Lines: {lines:,}')
    print(f'Covered Lines: {covered:,}')
    print(f'Missing Lines: {missing:,}')
    print('')
    
    if percent >= 70:
        print('✅ Coverage target achieved (≥70%)')
        exit_code = 0
    elif percent >= 50:
        print('⚠️ Coverage below target but acceptable (50-70%)')
        exit_code = 0
    else:
        print('❌ Coverage critically low (<50%)')
        exit_code = 1
    
    # Set outputs for GitHub Actions
    print(f'::set-output name=coverage_percent::{percent:.1f}')
    print(f'::set-output name=coverage_status::{"PASS" if exit_code == 0 else "FAIL"}')
    
    sys.exit(exit_code)
    
except Exception as e:
    print(f'❌ Error analyzing coverage: {e}')
    sys.exit(1)
"
        else
          echo '❌ No coverage data found'
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: reports/coverage/comprehensive_coverage.xml
        fail_ci_if_error: false
        verbose: true
      continue-on-error: true

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports-${{ github.sha }}
        path: |
          reports/coverage/
        retention-days: 30
      if: always()

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            const coverageFile = 'reports/coverage/comprehensive_coverage.json';
            if (fs.existsSync(coverageFile)) {
              const coverage = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
              const percent = coverage.totals?.percent_covered || 0;
              const lines = coverage.totals?.num_statements || 0;
              const covered = coverage.totals?.covered_lines || 0;
              
              const status = percent >= 70 ? '✅' : percent >= 50 ? '⚠️' : '❌';
              const statusText = percent >= 70 ? 'Good' : percent >= 50 ? 'Fair' : 'Needs Improvement';
              
              const comment = `## 📊 Coverage Report
              
              ${status} **Overall Coverage: ${percent.toFixed(1)}%** (${statusText})
              
              | Metric | Value |
              |--------|-------|
              | **Coverage** | ${percent.toFixed(1)}% |
              | **Lines** | ${lines.toLocaleString()} |
              | **Covered** | ${covered.toLocaleString()} |
              
              ### Coverage Status
              - 🎯 **Target**: 70%
              - 🚦 **Current**: ${percent.toFixed(1)}%
              - 📈 **Trend**: ${percent >= 70 ? 'On track' : 'Needs improvement'}
              
              📋 [View detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('Could not post coverage comment:', error.message);
          }
      continue-on-error: true

  # Epic-specific coverage analysis
  epic-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: coverage
    if: github.event_name != 'schedule'
    
    strategy:
      matrix:
        epic: [1, 8]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Epic ${{ matrix.epic }} coverage
      run: |
        if [ "${{ matrix.epic }}" = "1" ]; then
          # Epic 1: Multi-model system
          python -m pytest \
            tests/epic1/ \
            tests/unit/test_technical_term_manager.py \
            tests/unit/test_complexity_classifier.py \
            tests/unit/test_model_recommender.py \
            --cov=src \
            --cov-report=json:reports/epic${{ matrix.epic }}_coverage.json \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            -m epic1
        elif [ "${{ matrix.epic }}" = "8" ]; then
          # Epic 8: Cloud-native microservices
          python -m pytest \
            tests/epic8/ \
            --cov=services \
            --cov-report=json:reports/epic${{ matrix.epic }}_coverage.json \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -m epic8
        fi
      continue-on-error: true

    - name: Upload Epic ${{ matrix.epic }} coverage
      uses: actions/upload-artifact@v3
      with:
        name: epic-${{ matrix.epic }}-coverage-${{ github.sha }}
        path: reports/epic${{ matrix.epic }}_coverage.json
        retention-days: 14
      if: always()